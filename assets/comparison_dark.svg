<title id="t">The fastest, smallest, fairest sandbox on the BEAM</title>
<desc id="d">Compute: Hyperlang 0.35 ms, wasmex 0.68 ms, Luerl 84.7 ms, Dune 275 ms, erl_eval + handler 106 ms, Peer node 0.33 ms, OS process 0.38 ms; Start a tenant: Hyperlang 0.05 ms, wasmex 0.08 ms, Luerl 0.03 ms, Dune 0.41 ms, erl_eval + handler 0.01 ms, Peer node 112 ms, OS process 123 ms, Docker 178 ms; Memory per tenant: Hyperlang 23 KiB, wasmex 89 KiB, Luerl 71 KiB, Dune 109 KiB, erl_eval + handler 23 KiB, Peer node 74 MiB, OS process 76 MiB; Noisy neighbours: Hyperlang 1.65×, wasmex 4.5×, Luerl 3.04×, Dune 35.7×, erl_eval + handler 7.4×, Peer node 1.14×</desc>
<rect width="1600" height="900" fill="#1a1a19"/>
<text x="48" y="76" font-size="40" font-weight="650" fill="#f0efec">The fastest, smallest, fairest sandbox on the BEAM</text>
<text x="48" y="116" font-size="21" fill="#c3c2b7">Lower is better (log scale). Ranked against the other BEAM sandboxes; unsandboxed options shown for reference. Method: doc/COMPARISON.md</text>
