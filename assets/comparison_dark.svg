<text x="48" y="612" font-size="16" fill="#c3c2b7">Erlang interpreter; fun os:cmd/1 escaped</text>
<text x="48" y="652" font-size="23" font-weight="600" fill="#c3c2b7">Peer node</text>
<text x="48" y="676" font-size="16" fill="#c3c2b7">full ambient authority</text>
