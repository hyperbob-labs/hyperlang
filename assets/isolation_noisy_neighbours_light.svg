<title id="t">Victim p99 latency slowdown next to noisy tenants</title>
<desc id="d">Three panels (CPU load, heap pressure, compile load). Without scope controls the victim's p99 latency rises to 16.8x, 14.8x and 5.4x its unloaded value with 16 noisy tenants; with Hyperlang.Scope admission it stays at 1.3x, 2.3x and 1.0x.</desc>
