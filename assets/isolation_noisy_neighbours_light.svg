<title id="t">Victim p99 latency slowdown next to noisy tenants</title>
<desc id="d">Three panels (CPU load, heap pressure, compile load). With 16 noisy tenants that have no scope policy, the latency-class victim's p99 rises to 1.8x, 9.4x and 1.4x its unloaded value; with the neighbours in background scopes with quotas it stays at 1.1x, 1.1x and 1.0x.</desc>
