<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Victim p99 latency slowdown next to noisy tenants</title>
<desc id="d">Three panels (CPU load, heap pressure, compile load). With 16 noisy tenants that have no scope policy, the latency-class victim's p99 rises to 2.4x, 13.6x and 2.4x its unloaded value; with the neighbours in background scopes with quotas it rises to 1.7x, 2.1x and 1.9x.</desc>
